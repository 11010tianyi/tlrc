[workspace]
members = [".", "crates/aitldr-ai", "crates/aitldr-cache", "crates/aitldr-risk"]
resolver = "2"

[package]
name = "tlrc"
version = "0.1.0"
description = "tldr client with AI fallback for missing pages"
authors = ["Lena Pastwa <lena@lnps.me>", "11010tianyi"]
categories = ["command-line-utilities"]
keywords = ["tldr", "ai"]
repository = "https://github.com/11010tianyi/tlrc"
license = "MIT"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "tldr"
path = "src/main.rs"

[features]
default = ["socks-proxy"]
socks-proxy = ["ureq/socks-proxy"]

[dependencies]
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
dirs = "6.0.0"
log = "0.4.29"
once_cell = "1.21.3"
ring = "0.17.14"
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
serde = { version = "1.0.219", features = ["derive"] }
terminal_size = "0.4.4"
toml = "1.1.2"
unicode-width = { version = "0.2.2", default-features = false }
ureq = { version = "3.3.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
yansi = "1.0.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
aitldr-ai = { path = "crates/aitldr-ai" }
aitldr-cache = { path = "crates/aitldr-cache" }
aitldr-risk = { path = "crates/aitldr-risk" }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[lints.clippy]
all = "warn"
pedantic = "warn"
style = "warn"
struct_excessive_bools = { level = "allow", priority = 1 }
unnecessary_debug_formatting = { level = "allow", priority = 1 }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 3

[package.metadata.deb]
section = "utils"
priority = "optional"
license-file = ["LICENSE", "4"]
extended-description = ""
assets = [
	["target/release/tldr", "usr/bin/", "755"],
	["tldr.1", "usr/share/man/man1/", "644"],
	["completions/tldr.bash", "usr/share/bash-completion/completions/tldr", "644"],
	["completions/_tldr", "usr/share/zsh/vendor-completions/", "644"],
	["completions/tldr.fish", "usr/share/fish/vendor_completions.d/", "644"],
]
